[project]
name = "scholarrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Piyusham", email = "piyushamsrivastava988@gamil.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.21.4",
